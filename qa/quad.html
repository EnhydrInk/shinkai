<!doctype html><html lang="ja"><meta charset="utf-8"><title>深海 四つの席</title><style>body{margin:0;background:#1c3a52;color:#fffaf0}#controls{height:40px;display:flex;gap:12px;align-items:center}button,a{font:16px monospace}#views{display:grid;grid-template-columns:1280px 1280px;grid-template-rows:720px 720px;width:2560px;height:1440px}iframe{width:1280px;height:720px;border:0}canvas{display:block;width:384px;height:216px;image-rendering:pixelated}#views{position:absolute;top:300px}</style><div id="controls"><button id="record">録画開始</button><button id="stop" disabled>録画停止</button><a id="download" hidden>録画を保存</a><button id="snapshot">4視点を保存</button><span id="status">準備中</span></div><div id="views"></div><canvas width="2560" height="1440"></canvas><script type="module">
const fixture=await fetch('/fixture.json').then(r=>r.json()),frames=[],canvas=document.querySelector('canvas'),context=canvas.getContext('2d');context.imageSmoothingEnabled=false;
for(const seat of fixture.seats){const view='quad-'+seat.seatId;localStorage.setItem(`shinkai:${fixture.base}:${fixture.roomId}:${view}`,JSON.stringify(seat));const frame=document.createElement('iframe');frame.src=`/app/index.html?room=${fixture.roomId}&view=${view}&server=${encodeURIComponent(fixture.base)}`;document.querySelector('#views').append(frame);frames.push(frame);}
let recorder,chunks=[],startedAt=0,lastBubbleCount=0,bestBubbleCount=0,saving=false;
function composite(){context.fillStyle='#1c3a52';context.fillRect(0,0,2560,1440);frames.forEach((frame,i)=>{const layers=frame.contentDocument?.querySelectorAll('#stage canvas')??frame.contentDocument?.querySelectorAll('canvas');if(layers)for(const layer of layers)context.drawImage(layer,(i%2)*1280,Math.floor(i/2)*720,1280,720)});const count=frames.reduce((sum,frame)=>sum+Number(frame.contentDocument?.querySelector('#text')?.dataset.activeBubbles||0),0);if(count>lastBubbleCount&&count>=bestBubbleCount&&!saving){bestBubbleCount=count;saving=true;canvas.toBlob(async blob=>{await fetch('/snapshot?name=layout-bubbles',{method:'POST',body:blob});saving=false;},'image/png')}lastBubbleCount=count;if(recorder?.state==='recording')document.querySelector('#status').textContent=`録画 ${Math.floor((Date.now()-startedAt)/1000)}秒`;requestAnimationFrame(composite)}composite();
document.querySelector('#status').textContent='4視点・接続中';
document.querySelector('#record').onclick=()=>{chunks=[];const mimeType=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(canvas.captureStream(30),{mimeType,videoBitsPerSecond:8000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'}),a=document.querySelector('#download');a.href=URL.createObjectURL(blob);a.download='shinkai-four-views.'+(recorder.mimeType.includes('mp4')?'mp4':'webm');fetch('/recording',{method:'POST',headers:{'Content-Type':recorder.mimeType},body:blob}).then(r=>r.json()).then(r=>document.querySelector('#status').textContent=r.ok?'保存済み':'保存失敗');a.hidden=false;document.querySelector('#status').textContent=`保存できます (${Math.round(blob.size/1024)} KiB)`};recorder.start(1000);startedAt=Date.now();document.querySelector('#record').disabled=true;document.querySelector('#stop').disabled=false;};
document.querySelector('#snapshot').onclick=()=>canvas.toBlob(async blob=>{const r=await fetch('/snapshot',{method:'POST',body:blob}).then(r=>r.json());document.querySelector('#status').textContent=r.ok?'4視点保存済み':'保存失敗';},'image/png');
document.querySelector('#stop').onclick=()=>{recorder.stop();document.querySelector('#stop').disabled=true;document.querySelector('#record').disabled=false;};
</script></html>
